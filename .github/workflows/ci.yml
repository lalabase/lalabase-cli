# Every pull request and every push to main: vet, tests (with the race
# detector), lint, and the license rule of the core repository: every
# dependency is permissive (MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
# 0BSD), checked on the dependencies of the binary and of the tests. The release
# workflow calls this one first, so a tag is never published past these checks.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# One group per workflow, trigger and ref: a manual run on a tag shares no
# group with the release's call of this workflow (there github.workflow is
# "release"), and only a pull request cancels its own superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: the shells a pane may have
        # The launch tests run the typed line in sh, bash, zsh and fish and
        # fail on the CI when one is missing.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
      - name: go vet
        run: go vet ./...
      - name: go test
        # A hanging test fails within the limit instead of holding the job.
        # internal/ui runs its screen sweeps one after another, over four
        # minutes under -race here: the limit leaves room above that.
        run: go test -race -count=1 -timeout 10m ./...
      - name: fuzz the cleaning function briefly
        run: go test -run='^$' -fuzz=FuzzCleanedTextIsTerminalSafe -fuzztime=20s ./internal/clean/

  terminal-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: the shells a pane may have
        # bash and zsh come with macOS; the launch tests need fish too.
        run: brew install fish
      - name: test the terminal alone
        # The PTY cases wait a few seconds for the renderer's reaction; run
        # them without the other packages' load on the same cores.
        run: go test -race -count=1 -timeout 10m ./cmd/lalabase/
      - name: test platform boundaries
        run: go test -race -count=1 -timeout 10m ./internal/ui/... ./internal/worker/ ./internal/gateway/ ./internal/queue/ ./internal/present/ ./internal/uitext/ ./internal/terminal/ ./internal/sourceguard/ ./internal/profile/ ./internal/privatefs/ ./internal/safefile/ ./internal/diskcache/ ./internal/launchdir/ ./internal/api/ ./internal/features/ ./internal/cache/ ./internal/inboxfixture/ ./tools/inbox-fixture/ ./internal/launch/ ./internal/claudecfg/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./... --include_tests --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD

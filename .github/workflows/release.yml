# A tag v* is published only after the whole CI (vet, race tests, lint,
# licenses) passed on it. Three jobs, so only the last one holds a token that
# may write, and it runs no code from the repository:
#   ci      -> the CI workflow, read-only
#   build   -> macOS (arm64, amd64) and Linux (amd64, arm64), static
#              (CGO_ENABLED=0), no local paths (-trimpath), read-only
#   publish -> attaches the archives and checksums.txt to a GitHub release
# The tag reaches a shell only through an environment variable, never pasted
# into the script, and must look like a version.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag $TAG is no version" >&2; exit 1 ;;
          esac
          if printf '%s' "$TAG" | LC_ALL=C grep -q '[^A-Za-z0-9.+-]'; then
            echo "tag $TAG carries characters a version does not have" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="lalabase_${VERSION}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "build/$name/lalabase" ./cmd/lalabase
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Output to the terminal: a failed write has nobody left to tell.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # The update tool runs git with arguments the developer passes on the
        # command line; that is its job.
        - G204
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
